name: datalink-local

# All services are bound to localhost only. No external interfaces.
# Credentials are the well-known local-dev defaults — see .env.example.
#
# Profiles:
#   (default — no profile)  sftp, postgres, webhook-stub. All pulled from
#                           Docker Hub; works everywhere.
#   mcr                     azurite + sqlserver. Pulled from
#                           mcr.microsoft.com, which is blocked by Docker
#                           Desktop 4.51.0's built-in HTTP proxy on some
#                           setups (see docs/operations_runbook.md §"MCR
#                           pull fails"). Used by Phase 2+ when ingestion
#                           and the UM schema push actually run.
#
# `make up`          → default profile (Hub only)
# `make up-mcr`      → default + mcr profile (full stack)

services:
  # --- SFTP landing zone for Claims / Membership EDI files --------------
  sftp:
    image: atmoz/sftp:alpine
    container_name: datalink-sftp
    ports:
      - "127.0.0.1:2222:22"
    # atmoz/sftp command format: user:password[:e][:uid:gid[:dir1,dir2,...]]
    # The dir list is chown'd to user:gid at startup.
    # NOTE: don't mount a volume at /home/datalink/drop — atmoz cannot chown
    # a pre-existing mount point. Dev data is ephemeral across `make down`.
    command: "datalink:datalink_local_only:1001:100:drop"
    healthcheck:
      test: ["CMD", "sh", "-c", "pgrep sshd || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- ADLS Gen2 emulator (Blob API) ------------------------------------
  # In the `mcr` profile — off by default until Phase 2 needs it.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.31.0
    container_name: datalink-azurite
    profiles: ["mcr"]
    command: >
      azurite
        --blobHost 0.0.0.0
        --queueHost 0.0.0.0
        --tableHost 0.0.0.0
        --skipApiVersionCheck
        --location /data
    ports:
      - "127.0.0.1:10000:10000"   # Blob
      - "127.0.0.1:10001:10001"   # Queue
      - "127.0.0.1:10002:10002"   # Table
    volumes:
      - azurite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 10000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Operational DB #1 — current prod target --------------------------
  # In the `mcr` profile — off by default until Phase 4 pushes to it.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: datalink-sqlserver
    profiles: ["mcr"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DataLink_LocalOnly_2026!"
      MSSQL_PID: "Developer"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      # /opt/mssql-tools18/bin/sqlcmd is bundled in the 2022 image
      test:
        - "CMD-SHELL"
        - "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -No -b || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --- Operational DB #2 — future prod target ---------------------------
  # Host port :5434 (not :5432) because some dev machines have a
  # Windows-native Postgres squatting on :5432 (observed on Jatin's
  # XPS8940: PID 7540). :5434 is free on the machines we care about.
  postgres:
    image: postgres:16
    container_name: datalink-postgres
    environment:
      POSTGRES_USER: datalink
      POSTGRES_PASSWORD: datalink_local_only
      POSTGRES_DB: datalink_um
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "datalink", "-d", "datalink_um"]

  # --- Operational DB #3 — second Postgres used to demo router fan-out --
  # Prod has SQL Server + PostgreSQL as two distinct targets. SQL Server
  # is blocked locally by Docker Desktop 4.51.0's built-in proxy. We run a
  # second Postgres on :5433 so the router's "fan out to N targets" and
  # "config-flip restricts targets" invariants can be tested end-to-end.
  # Remove this service for prod; targets will be [sqlserver, postgres].
  postgres_replica:
    image: postgres:16
    container_name: datalink-postgres-replica
    environment:
      POSTGRES_USER: datalink
      POSTGRES_PASSWORD: datalink_local_only
      POSTGRES_DB: datalink_um_replica
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "datalink", "-d", "datalink_um_replica"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Webhook stub — local Teams replacement ---------------------------
  webhook-stub:
    build:
      context: ./docker/webhook-stub
    container_name: datalink-webhook-stub
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - webhook_logs:/app/logs
    healthcheck:
      # Use 127.0.0.1 — alpine resolves "localhost" to ::1 first, and our
      # Python HTTP server binds IPv4 only, so localhost would get ECONNREFUSED.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  azurite_data:
  sqlserver_data:
  postgres_data:
  postgres_replica_data:
  webhook_logs:
