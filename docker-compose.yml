name: datalink-local

# All services are bound to localhost only. No external interfaces.
# Credentials are the well-known local-dev defaults — see .env.example.
#
# Profile matrix:
#   (default — no profile)   Every service needed for the Phase 5.7 exec
#                            demo — sftp, postgres ×2, webhook-stub,
#                            azurite, sqlserver, pgadmin, adminer,
#                            nginx-gx-docs, and the observability
#                            stack (prometheus, loki, tempo, grafana,
#                            otel-collector).
#
#                            Azurite + SQL Server used to live under the
#                            `mcr` profile because Docker Desktop 4.51.0's
#                            hub proxy blocked mcr.microsoft.com pulls.
#                            Post-Phase-5.7 we run native Docker-in-WSL2
#                            (see docs/install.md §"Native Docker in WSL2")
#                            which bypasses the proxy — so these pulls
#                            work cleanly and are in the default stack now.
#
# `make up`   → full stack (everything healthy in ~90 s on a warm cache)
# `make down` → stop + keep volumes
# `make nuke` → stop + drop volumes (full reset)

networks:
  datalink:
    driver: bridge

services:
  # =====================================================================
  # BRONZE LAYER SOURCES
  # =====================================================================

  # --- SFTP landing zone for Claims / Membership EDI files --------------
  sftp:
    restart: unless-stopped
    image: atmoz/sftp:alpine
    container_name: datalink-sftp
    networks: [datalink]
    ports:
      - "127.0.0.1:2222:22"
    # atmoz/sftp command format: user:password[:e][:uid:gid[:dir1,dir2,...]]
    # The dir list is chown'd to user:gid at startup.
    # Phase 5.7: mount the drop dir as a named volume so filebrowser (web
    # upload) and Airflow (the consumer) can see the same files. atmoz
    # chowns named volumes to 1001:100 on first create — the same uid
    # filebrowser and airflow use.
    command: "datalink:datalink_local_only:1001:100:drop"
    volumes:
      - sftp_drop:/home/datalink/drop
    healthcheck:
      test: ["CMD", "sh", "-c", "pgrep sshd || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- SFTP drop-zone permissions bootstrap ----------------------------
  # atmoz/sftp's auto-chown only fires reliably on volume FIRST creation.
  # On WSL restarts + named-volume re-mounts the drop dir's perms can drift,
  # blocking paramiko's sftp.put() with EACCES. This one-shot runs after
  # sftp is healthy and normalises owner + mode every `docker compose up`.
  sftp_init:
    image: busybox:1.36
    container_name: datalink-sftp-init
    networks: [datalink]
    depends_on:
      sftp: { condition: service_healthy }
    volumes:
      - sftp_drop:/drop
    entrypoint:
      - /bin/sh
      - -c
      - |
        chown -R 1001:100 /drop
        chmod -R 775 /drop
        echo "SFTP drop perms normalised: $$(ls -ld /drop)"
    restart: "no"

  # --- File browser — drag-drop CSVs into the SFTP drop zone ------------
  # Shares the sftp_drop volume, so anything dropped here lands in exactly
  # the path Airflow's bronze_ingest DAG reads from. No SFTP CLI required.
  filebrowser:
    restart: unless-stopped
    image: filebrowser/filebrowser:v2.31.2
    container_name: datalink-filebrowser
    networks: [datalink]
    # Runs as root so the filebrowser_config named volume is writable and
    # files uploaded to /srv (bind-mounted to sftp_drop) get world-readable
    # perms that atmoz's uid-1001 SFTP daemon + Airflow's uid-50000 worker
    # can both read. Localhost-only deployment; not a prod pattern.
    ports:
      - "${DL_BIND_HOST:-127.0.0.1}:8082:80"
    volumes:
      - sftp_drop:/srv
      - filebrowser_config:/config
      - ./docker/filebrowser/filebrowser.json:/.filebrowser.json:ro
    healthcheck:
      # filebrowser has no /health endpoint; hit root to confirm the web
      # server is accepting connections.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- ADLS Gen2 emulator (Blob API) ------------------------------------
  azurite:
    restart: unless-stopped
    image: mcr.microsoft.com/azure-storage/azurite:3.31.0
    container_name: datalink-azurite
    networks: [datalink]
    command: >
      azurite
        --blobHost 0.0.0.0
        --queueHost 0.0.0.0
        --tableHost 0.0.0.0
        --skipApiVersionCheck
        --location /data
    ports:
      - "127.0.0.1:10000:10000"   # Blob
      - "127.0.0.1:10001:10001"   # Queue
      - "127.0.0.1:10002:10002"   # Table
    volumes:
      - azurite_data:/data
    healthcheck:
      # Azurite images don't ship nc; use /dev/tcp via bash-less sh.
      # `node -e '...'` is always available because the Azurite image IS node.
      test:
        - "CMD-SHELL"
        - "node -e \"require('net').connect(10000,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""
      interval: 5s
      timeout: 3s
      retries: 5

  # =====================================================================
  # OPERATIONAL DATABASES (Gold push targets)
  # =====================================================================

  # --- Operational DB #1 — SQL Server 2022 (prod target) ---------------
  sqlserver:
    restart: unless-stopped
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: datalink-sqlserver
    networks: [datalink]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DataLink_LocalOnly_2026!"
      MSSQL_PID: "Developer"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      # /opt/mssql-tools18/bin/sqlcmd is bundled in the 2022 image.
      # -No disables strict TLS; -b returns exit-1 on SQL error.
      test:
        - "CMD-SHELL"
        - "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -No -b || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --- SQL Server init job — creates DataLinkUM DB + [UM] schema -------
  # Runs once after sqlserver is healthy, then exits. Idempotent —
  # re-running `make up` is safe (all DDL uses IF NOT EXISTS).
  sqlserver_init:
    image: mcr.microsoft.com/mssql-tools
    container_name: datalink-sqlserver-init
    networks: [datalink]
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./docker/sqlserver-init:/init:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        /opt/mssql-tools/bin/sqlcmd \
          -S sqlserver -U sa -P "DataLink_LocalOnly_2026!" \
          -C -b -i /init/init.sql
    # Retry up to 10 times on failure — covers the SQL Server startup race
    # where the container's healthcheck passes (master is up) but the
    # newly-created DataLinkUM database hasn't finished attaching yet
    # ("Database 5 cannot be autostarted during server shutdown or startup").
    # The init script itself is idempotent (IF NOT EXISTS guards), so
    # re-running is safe. Once it succeeds, restart:on-failure stops retrying.
    restart: on-failure:10

  # --- Operational DB #2 — Postgres (primary router target) ------------
  # Host port :5434 (not :5432) because some dev machines have a
  # Windows-native Postgres squatting on :5432 (observed on Jatin's
  # XPS8940: PID 7540). :5434 is free on the machines we care about.
  postgres:
    restart: unless-stopped
    # pgvector/pgvector:pg16 is a drop-in for postgres:16 with the
    # `vector` extension binary already installed. Required by
    # agent_memory.suite_embeddings (DQ AI Architect RAG) and
    # agent_memory.standard_references (Phase 14 Data Contract Architect).
    # Vanilla postgres:16 leaves the extension metadata in the volume but
    # without the .so file — every CREATE TABLE with a vector column then
    # fails with `could not access file "$libdir/vector"`.
    image: pgvector/pgvector:pg16
    container_name: datalink-postgres
    networks: [datalink]
    environment:
      POSTGRES_USER: datalink
      POSTGRES_PASSWORD: datalink_local_only
      POSTGRES_DB: datalink_um
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "datalink", "-d", "datalink_um"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Operational DB #3 — second Postgres used to demo router fan-out -
  # Shows "config flip restricts targets". In prod this service is
  # removed; router targets become [sqlserver, postgres].
  postgres_replica:
    restart: unless-stopped
    # Match the primary's image so streaming replication works. pgvector
    # binary not strictly needed here (replica isn't a target for
    # agent_memory writes) but image symmetry avoids drift surprises.
    image: pgvector/pgvector:pg16
    container_name: datalink-postgres-replica
    networks: [datalink]
    environment:
      POSTGRES_USER: datalink
      POSTGRES_PASSWORD: datalink_local_only
      POSTGRES_DB: datalink_um_replica
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "datalink", "-d", "datalink_um_replica"]
      interval: 5s
      timeout: 3s
      retries: 10

  # =====================================================================
  # NOTIFICATIONS
  # =====================================================================

  webhook-stub:
    restart: unless-stopped
    build:
      context: ./docker/webhook-stub
    container_name: datalink-webhook-stub
    networks: [datalink]
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - webhook_logs:/app/logs
    healthcheck:
      # Use 127.0.0.1 — alpine resolves "localhost" to ::1 first, and our
      # Python HTTP server binds IPv4 only, so localhost would get ECONNREFUSED.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =====================================================================
  # DEMO BROWSERS — the "click and see data" surface for execs + team
  # =====================================================================

  # --- Postgres-specific UI (richest for PG tuning / query explain) ----
  pgadmin:
    restart: unless-stopped
    image: dpage/pgadmin4:8
    container_name: datalink-pgadmin
    networks: [datalink]
    depends_on:
      postgres:         { condition: service_healthy }
      postgres_replica: { condition: service_healthy }
    environment:
      # pgAdmin's startup script validates the TLD against a public-suffix
      # list and rejects .invalid AND .local. Using a real-looking domain
      # (no email ever sent; this is the admin login alias only).
      PGADMIN_DEFAULT_EMAIL: datalink@example.com
      PGADMIN_DEFAULT_PASSWORD: datalink_local_only
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_DISABLE_POSTFIX: "True"
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: "False"
    ports:
      - "${DL_BIND_HOST:-127.0.0.1}:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgpass:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --- One-client-for-all DBs (DuckDB/Postgres/SQL Server) --------------
  # Adminer speaks DuckDB via plugin, which ships in the image by default
  # on 4.8.1+. Exec demo lets you click a tab and see each zone.
  adminer:
    restart: unless-stopped
    image: adminer:4.8.1
    container_name: datalink-adminer
    networks: [datalink]
    ports:
      - "${DL_BIND_HOST:-127.0.0.1}:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    healthcheck:
      # adminer is PHP-only — no nc/wget/curl. Use PHP's built-in socket.
      test:
        - "CMD-SHELL"
        - "php -r 'exit(@fsockopen(\"127.0.0.1\", 8080) ? 0 : 1);'"
      interval: 10s
      timeout: 3s
      retries: 5

  # --- GX Data Docs (HTML reports per checkpoint run) ------------------
  nginx-gx-docs:
    restart: unless-stopped
    image: nginx:1.27-alpine
    container_name: datalink-gx-docs
    networks: [datalink]
    ports:
      - "${DL_BIND_HOST:-127.0.0.1}:8090:8090"
    volumes:
      - ./docker/nginx-gx-docs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gx/uncommitted/data_docs/local_site:/usr/share/nginx/html:ro
      # Fallback index.html, served when GX hasn't generated docs yet.
      # GX's own index.html (once generated) sits at the root of
      # data_docs/local_site/ and takes precedence.
      - ./docker/nginx-gx-docs/fallback-index.html:/usr/share/nginx/fallback/index.html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # =====================================================================
  # OBSERVABILITY STACK — OTEL Collector + Prometheus + Loki + Tempo + Grafana
  # =====================================================================

  # --- OTLP receiver + fan-out to Prom/Loki/Tempo ----------------------
  otel-collector:
    restart: unless-stopped
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: datalink-otel
    networks: [datalink]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./docker/otel-collector/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC (Python SDK default)
      - "127.0.0.1:4318:4318"   # OTLP HTTP
      - "127.0.0.1:8889:8889"   # Prometheus exporter (scraped by prom)
      - "127.0.0.1:13133:13133" # health check
    # The otel-collector-contrib image is distroless — no shell, no wget.
    # Docker's default "process alive" check suffices; health_check
    # extension at :13133 is reachable from Grafana for wiring verification.

  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v2.55.0
    container_name: datalink-prometheus
    networks: [datalink]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  loki:
    restart: unless-stopped
    image: grafana/loki:3.2.0
    container_name: datalink-loki
    networks: [datalink]
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  tempo:
    restart: unless-stopped
    image: grafana/tempo:2.6.0
    container_name: datalink-tempo
    networks: [datalink]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"   # HTTP API
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3200/ready >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  grafana:
    restart: unless-stopped
    image: grafana/grafana:11.3.0
    container_name: datalink-grafana
    networks: [datalink]
    depends_on:
      prometheus: { condition: service_healthy }
      loki:       { condition: service_healthy }
      tempo:      { condition: service_healthy }
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin_local_only
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
      GF_LOG_LEVEL: warn
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${DL_BIND_HOST:-127.0.0.1}:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  # =====================================================================
  # AIRFLOW — LocalExecutor in compose. Scheduler executes DAGs in-process
  # so DuckDB file-lock is never contested between tasks. 3 containers:
  # init (one-shot), webserver, scheduler.
  # =====================================================================

  # Dedicated Postgres for Airflow's own metadata DB. Separate from the
  # operational Postgres the router pushes Gold UM into so demo reset
  # doesn't wipe Airflow's state.
  airflow_db:
    restart: unless-stopped
    image: postgres:16
    container_name: datalink-airflow-db
    networks: [datalink]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_local_only
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "airflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: run airflow db migrate + create the admin user, then exit.
  airflow_init:
    build:
      context: ./docker/airflow
    image: datalink-airflow:2.9.3
    container_name: datalink-airflow-init
    networks: [datalink]
    # Phase 6: load ANTHROPIC_API_KEY + DL_* overrides from host-side .env
    # (.env is gitignored, chmod 600). Lets agents call real Claude.
    env_file:
      - path: .env
        required: false
    depends_on:
      airflow_db:
        condition: service_healthy
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      # Point Airflow at the dags/ folder inside our bind-mounted repo root.
      AIRFLOW__CORE__DAGS_FOLDER: /opt/datalink/dags
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      # Our DAG files import build_dag() from a helper module; they don't
      # contain the literal string "DAG" or "airflow" at top level, which
      # Airflow's default DAG_DISCOVERY_SAFE_MODE string-scanner requires.
      # Force full parsing of every .py in DAGS_FOLDER instead.
      AIRFLOW__CORE__DAG_DISCOVERY_SAFE_MODE: "False"
      AIRFLOW__CORE__DAG_FILE_PROCESSOR_TIMEOUT: "120"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_local_only@airflow_db/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: datalink_local_only_secret_key_change_in_prod
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      # datalink task-side env so adapters + dbt work without repeated config.
      DL_ENV: local
      # 127.0.0.1 doesn't resolve inside Airflow container — talk via the
      # compose network instead. These override the settings.yaml's 127.0.0.1.
      DL_ADAPTERS__SFTP__HOST: sftp
      DL_ADAPTERS__SFTP__PORT: "22"
      DL_ADAPTERS__OPERATIONAL_DBS__SQLSERVER__HOST: sqlserver
      DL_ADAPTERS__OPERATIONAL_DBS__SQLSERVER__PORT: "1433"
      DL_ADAPTERS__OPERATIONAL_DBS__POSTGRES__HOST: postgres
      DL_ADAPTERS__OPERATIONAL_DBS__POSTGRES__PORT: "5432"
      DL_ADAPTERS__OPERATIONAL_DBS__POSTGRES_REPLICA__HOST: postgres_replica
      DL_ADAPTERS__OPERATIONAL_DBS__POSTGRES_REPLICA__PORT: "5432"
      DL_ADAPTERS__WAREHOUSE__PATH: /opt/datalink/warehouse.duckdb
      DL_ADAPTERS__NOTIFIER__PATH: /opt/datalink/logs/notifications.jsonl
    volumes:
      - .:/opt/datalink                    # repo root — dags/, config/, dbt/, datalink/
      - airflow_logs:/opt/airflow/logs
      - sftp_drop:/opt/sftp-drop            # Airflow can see the SFTP drop
    # Explicit db migrate + admin user create. The `|| true` swallows the
    # "user already exists" error on idempotent re-runs.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        pip install --no-deps -q -e /opt/datalink
        airflow db migrate
        airflow users create \
          --username admin --password admin_local_only \
          --firstname DataLink --lastname Admin --role Admin \
          --email datalink@example.com || true
        echo "Airflow init complete."
    restart: "no"

  airflow_webserver:
    restart: unless-stopped
    image: datalink-airflow:2.9.3
    container_name: datalink-airflow-webserver
    networks: [datalink]
    env_file:
      - path: .env
        required: false
    depends_on:
      airflow_db: { condition: service_healthy }
      airflow_init: { condition: service_completed_successfully }
    environment: *airflow_env
    volumes:
      - .:/opt/datalink
      - ./docker/airflow/entrypoint.sh:/opt/custom-entrypoint.sh:ro
      - airflow_logs:/opt/airflow/logs
      - sftp_drop:/opt/sftp-drop
    ports:
      - "${DL_BIND_HOST:-127.0.0.1}:8088:8080"
    entrypoint: ["/opt/custom-entrypoint.sh"]
    command: ["webserver"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sfo /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  airflow_scheduler:
    restart: unless-stopped
    image: datalink-airflow:2.9.3
    container_name: datalink-airflow-scheduler
    networks: [datalink]
    env_file:
      - path: .env
        required: false
    depends_on:
      airflow_db: { condition: service_healthy }
      airflow_init: { condition: service_completed_successfully }
    environment: *airflow_env
    volumes:
      - .:/opt/datalink
      - ./docker/airflow/entrypoint.sh:/opt/custom-entrypoint.sh:ro
      - airflow_logs:/opt/airflow/logs
      - sftp_drop:/opt/sftp-drop
    entrypoint: ["/opt/custom-entrypoint.sh"]
    command: ["scheduler"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $$(hostname) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # =====================================================================
  # CONTROL TOWER — the single exec URL (Streamlit) at http://localhost:8000
  # =====================================================================

  control_tower:
    # Phase 22 — point entrypoint at the bind-mounted host copy so edits to
    # docker/control-tower/entrypoint.sh take effect on the next recreate
    # without rebuilding the image (default ENTRYPOINT in the image is
    # /opt/entrypoint.sh which was COPYd in at build time).
    entrypoint: ["/opt/datalink/docker/control-tower/entrypoint.sh"]
    restart: unless-stopped
    build:
      context: ./docker/control-tower
    image: datalink-control-tower:0.1
    container_name: datalink-control-tower
    networks: [datalink]
    env_file:
      - path: .env
        required: false
    depends_on:
      airflow_webserver: { condition: service_healthy }
      postgres:          { condition: service_healthy }
      postgres_replica:  { condition: service_healthy }
      sqlserver:         { condition: service_healthy }
      sftp:              { condition: service_healthy }
    environment:
      # All sibling services by compose DNS name — Control Tower is inside
      # the compose network. Overridable per env for non-local deploys.
      DL_CT_AIRFLOW_URL: http://airflow_webserver:8080
      DL_CT_AIRFLOW_USER: admin
      DL_CT_AIRFLOW_PASS: admin_local_only
      DL_CT_SFTP_HOST: sftp
      DL_CT_SFTP_PORT: "22"
      DL_CT_SFTP_USER: datalink
      DL_CT_SFTP_PASS: datalink_local_only
      DL_CT_WAREHOUSE_PATH: /opt/datalink/warehouse.duckdb
      DL_CT_PG_HOST: postgres
      DL_CT_PG_DB: datalink_um
      DL_CT_PG_USER: datalink
      DL_CT_PG_PASS: datalink_local_only
      DL_CT_PG_REPLICA_HOST: postgres_replica
      DL_CT_PG_REPLICA_DB: datalink_um_replica
      DL_CT_MSSQL_HOST: sqlserver
      DL_CT_MSSQL_PORT: "1433"
      DL_CT_MSSQL_DB: DataLinkUM
      DL_CT_MSSQL_USER: datalink
      DL_CT_MSSQL_PASS: datalink_local_only
      # Phase 22 — skip the in-container baseline DQ-suite seeder.  Each
      # baseline suite calls Voyage AI for an embedding; free-tier 3 RPM
      # makes 84 seeds take ~5 min of cold-start latency on every container
      # recreate, which defeats the repeatable-demo flow.  Pages handle
      # empty CONTROL.dq_suites cleanly.  Override to "0" if you ever want
      # the baselines back.
      DL_SKIP_BASELINE_SEED: "1"
    volumes:
      - .:/opt/datalink                     # code hot-reloads without rebuild
    ports:
      - "${DL_BIND_HOST:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sfo /dev/null http://127.0.0.1:8000/_stcore/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  # =====================================================================
  # PORTAINER — web UI for container ops (replacement for Docker Desktop's
  # list/logs/stats view, reading from native dockerd-in-WSL2)
  # =====================================================================

  portainer:
    restart: unless-stopped
    image: portainer/portainer-ce:2.21.4
    container_name: datalink-portainer
    networks: [datalink]
    # Portainer reads the host Docker API via the mounted socket. Only the
    # native WSL2 dockerd is exposed there — Portainer sees exactly the
    # DataLink containers + any other local dev stacks on the same daemon.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "127.0.0.1:9443:9443"   # HTTPS UI (self-signed cert; browser warns first time)
    # No healthcheck: the distroless base ships without curl/wget. Docker's
    # "container alive" check is enough for this use case.

volumes:
  azurite_data:
  sqlserver_data:
  postgres_data:
  postgres_replica_data:
  webhook_logs:
  pgadmin_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
  sftp_drop:
  filebrowser_config:
  airflow_db_data:
  airflow_logs:
  portainer_data:
