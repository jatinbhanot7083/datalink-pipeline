version: 2

models:
  - name: gold_patient_auth
    description: "Gold: authorization header — one row per auth (feeds [UM].[PatientAuth])."
    columns:
      - name: patient_auth_id
        tests: [not_null, unique]
      - name: auth_code
        tests: [not_null]
      - name: auth_type_id
        tests:
          - not_null
          - relationships:
              to: ref('lu_auth_type')
              field: lu_auth_type_id
      - name: auth_status_id
        tests:
          - not_null
          - relationships:
              to: ref('lu_auth_status')
              field: lu_auth_status_id

  - name: gold_auth_decision
    description: "Gold: one decision event per auth — feeds [UM].[AuthDecision]."
    columns:
      - name: auth_decision_id
        tests: [not_null, unique]
      - name: patient_auth_id
        tests:
          - not_null
          - relationships:
              to: ref('gold_patient_auth')
              field: patient_auth_id
      - name: decision_status_id
        tests:
          - not_null
          - relationships:
              to: ref('lu_decision_status')
              field: lu_decision_status_id

  - name: gold_auth_code
    description: "Gold: CPT/HCPCS per auth — feeds [UM].[AuthCode]."
    columns:
      - name: auth_code_id
        tests: [not_null, unique]
      - name: patient_auth_id
        tests:
          - not_null
          - relationships:
              to: ref('gold_patient_auth')
              field: patient_auth_id
      - name: auth_code_ref
        tests: [not_null]

  - name: gold_auth_diagnoses
    description: "Gold: ICD-10 per auth — feeds [UM].[AuthDiagnoses]."
    columns:
      - name: auth_diagnosis_id
        tests: [not_null, unique]
      - name: patient_auth_id
        tests:
          - not_null
          - relationships:
              to: ref('gold_patient_auth')
              field: patient_auth_id
      - name: diagnosis_code
        tests: [not_null]

  - name: gold_auth_provider
    description: "Gold: provider per auth — feeds [UM].[AuthProvider]."
    columns:
      - name: auth_provider_id
        tests: [not_null, unique]
      - name: patient_auth_id
        tests:
          - not_null
          - relationships:
              to: ref('gold_patient_auth')
              field: patient_auth_id
      - name: provider_npi
        tests: [not_null]

seeds:
  - name: lu_auth_status
    config:
      schema: gold_um
    columns:
      - name: lu_auth_status_id
        tests: [not_null, unique]
      - name: name
        tests: [not_null]

  - name: lu_decision_status
    config:
      schema: gold_um
    columns:
      - name: lu_decision_status_id
        tests: [not_null, unique]
      - name: name
        tests: [not_null]

  - name: lu_auth_type
    config:
      schema: gold_um
    columns:
      - name: lu_auth_type_id
        tests: [not_null, unique]
      - name: name
        tests: [not_null]
