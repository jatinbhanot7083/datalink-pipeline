[project]
name = "datalink-pipeline"
version = "0.1.0"
description = "DataLink Local-First Medallion Pipeline with Plug-in Great Expectations + CrewAI"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Team DataLink" }]
license = { text = "Proprietary" }

# Runtime deps for Phase 1. Deps for later phases are tracked in optional-dependencies
# below and pulled in by `uv sync --extra <group>` once the phase needs them.
dependencies = [
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "pyyaml>=6.0,<7.0",
    "structlog>=24.1,<25.0",
    "click>=8.1,<9.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
# Phase 2+: Bronze ingestion
ingest = [
    "paramiko>=3.4,<4.0",                 # sFTP
    "azure-storage-blob>=12.20,<13.0",    # ADLS / Azurite
    "azure-storage-file-datalake>=12.15,<13.0",
    "duckdb>=1.0,<2.0",
    "pandas>=2.2,<3.0",
]

# Phase 3+: Silver transformations
silver = [
    "dbt-core>=1.8,<1.9",
    "dbt-duckdb>=1.8,<1.9",
]

# Phase 4+: dual-warehouse router (SQL Server + PostgreSQL)
operational = [
    "pyodbc>=5.1,<6.0",                   # SQL Server
    "psycopg[binary]>=3.2,<4.0",          # PostgreSQL
    "sqlalchemy>=2.0,<3.0",
]

# Phase 4+: prod warehouse + prod object store adapters
prod-adapters = [
    "snowflake-connector-python>=3.11,<4.0",
    "dbt-snowflake>=1.8,<1.9",
    "dbt-postgres>=1.8,<1.9",
]

# Phase 5: GX + CrewAI plug-in layer
quality = [
    "great-expectations>=1.0,<2.0",
]
agents = [
    "crewai>=0.80,<1.0",
    "anthropic>=0.40,<1.0",
]

# Large-batch processing (Pandas → PySpark threshold)
spark = [
    "pyspark>=3.5,<4.0",
]

# Phase 5.5: orchestration — Airflow DAGs (opt-in).
# WARNING: apache-airflow 2.9.x pins sqlalchemy<2.0, which collides with the
# `operational` extra (sqlalchemy>=2.0 for psycopg 3 + pyodbc). Do NOT install
# this extra in the main dev venv. Create a dedicated venv for Airflow work:
#     uv venv .venv-airflow --python 3.11
#     uv pip install -e ".[orchestration]" --python .venv-airflow/bin/python
# The `local_sequential` orchestrator — the DEFAULT — is pure stdlib, no extra.
orchestration = [
    "apache-airflow>=2.9,<2.10",
]

# Aggregated "everything" group. Deliberately excludes `orchestration` due to
# the sqlalchemy conflict documented above.
all = [
    "datalink-pipeline[ingest,silver,operational,prod-adapters,quality,agents,spark]",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-mock>=3.14,<4.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "pre-commit>=3.7,<4.0",
    "types-PyYAML>=6.0,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datalink"]

# ------------------------------------------------------------
# uv — conflicting extras
# ------------------------------------------------------------
# apache-airflow 2.9.x requires sqlalchemy<2.0; our `operational` extra
# (psycopg 3 + pyodbc) requires sqlalchemy>=2.0. These cannot coexist in
# one lockfile. Declaring them conflicting tells uv to resolve each set
# independently — sync one or the other, never both in the same venv.
[tool.uv]
conflicts = [
    [
        { extra = "operational" },
        { extra = "orchestration" },
    ],
    [
        { extra = "prod-adapters" },
        { extra = "orchestration" },
    ],
    [
        { extra = "all" },
        { extra = "orchestration" },
    ],
]

# ------------------------------------------------------------
# ruff
# ------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dbt/target", "gx/uncommitted", "logs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "N",    # naming
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "E501",  # line length — ruff-format handles
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]                              # pytest funcs may not follow snake_case
"docker/webhook-stub/**" = ["N802", "RUF001"]      # http.server do_GET/do_POST + smart-quote HTML
"datalink/ui/**" = ["RUF001", "RUF003"]            # UI uses emoji/unicode glyphs in labels

# ------------------------------------------------------------
# mypy
# ------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["dbt/", "gx/uncommitted/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = [
    "crewai.*", "paramiko.*", "pyodbc.*", "psycopg.*", "snowflake.*", "dbt.*",
    "pandas.*", "pandas",
    "great_expectations.*",
    "airflow.*", "airflow",
    "streamlit", "streamlit.*", "streamlit_extras.*",
    "httpx", "httpx.*",
    # Plotly only exists in the control-tower container (see docker/control-tower/Dockerfile).
    # Local dev venv doesn't install it — suppress import stub lookups.
    "plotly", "plotly.*",
]
ignore_missing_imports = true

# GX 1.x's great_expectations.expectations namespace does not re-export its
# concrete classes via __all__. Our suites import them directly (they work at
# runtime) — disable the attr-defined error specifically for the suite modules
# and for checkpoint.py which imports UpdateDataDocsAction for Data Docs.
[[tool.mypy.overrides]]
module = ["datalink.quality.suites.*", "datalink.quality.checkpoint"]
disable_error_code = ["attr-defined"]

# ------------------------------------------------------------
# pytest
# ------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: fast, no external deps",
    "integration: requires docker-compose services",
    "plugout: proves GX/agents can be removed without breaking pipeline",
    "phase: per-phase verify tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic.*",
    # GX 1.x still uses marshmallow.Number internally — upstream issue; our
    # code doesn't depend on it. Silence so collection doesn't error out.
    "ignore::marshmallow.warnings.ChangedInMarshmallow4Warning",
    # GX emits a PerformanceWarning when validating pandas DataFrames that
    # have object-typed columns containing mixed types — unavoidable with
    # DuckDB VARCHAR values cast through psycopg/pandas.
    "ignore::pandas.errors.PerformanceWarning",
    # GX imports the deprecated sre_constants / sre_parse stdlib modules on
    # py3.11 — transitively from fluent data connectors. Upstream fix in GX 1.17+.
    "ignore:module 'sre_constants' is deprecated:DeprecationWarning",
    "ignore:module 'sre_parse' is deprecated:DeprecationWarning",
    # urllib3 / chromadb-adjacent deprecation noise from the crewai install.
    "ignore::DeprecationWarning:chromadb.*",
    "ignore::DeprecationWarning:pkg_resources.*",
    # GX's ephemeral context finalizer raises during weakref cleanup —
    # pytest captures it as an unraisable exception. Not our bug.
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
