minimum_pre_commit_version: "3.7.0"
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: "^infra/helm/.*values\\.yaml$"   # helm templating breaks yaml lint
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2048"]                    # source .docx are ~1.5 MB each
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.7
          - types-PyYAML>=6.0
        # only type-check the datalink package; ignoring tests keeps CI fast.
        files: "^datalink/"
