# Dual-warehouse bulk-push router.
# Controls which operational DBs receive the Gold bulk push.
# Each entry must be a key in adapters.operational_dbs for the selected env.
#
# Phase 5.7 default: [sqlserver, postgres, postgres_replica] — SQL Server is
# the real current-prod target, Postgres is the future target, and the second
# Postgres exists only locally to demonstrate fan-out + config-flip. Prod
# override: DL_FEATURES__WAREHOUSE_ROUTER__TARGETS=sqlserver,postgres
#
# Pre-Phase-5.7 this list dropped sqlserver because Docker Desktop 4.51.0's
# hub proxy blocked the MCR pull. Native Docker-in-WSL2 fixes that (see
# docs/install.md §"Native Docker in WSL2").

features:
  warehouse_router:
    targets:
      - sqlserver
      - postgres
      - postgres_replica
