# Local environment: Windows 11 + WSL2 + native Docker-in-WSL2.
# Selected by DL_ENV=local (the default).
#
# IMPORTANT — host values are 127.0.0.1 (not `localhost`):
# Ubuntu 24.04 in WSL2 resolves `localhost` to `::1` (IPv6), but Docker
# publishes container ports on IPv4 only (`127.0.0.1:PORT->PORT/tcp`).
# pyodbc and a few other client libs don't fall back IPv6→IPv4 cleanly and
# time out. 127.0.0.1 sidesteps the resolution entirely.

env: local
orchestrator: local_sequential

adapters:
  sftp:
    type: atmoz
    host: 127.0.0.1
    port: 2222
    user: datalink
    password: datalink_local_only
    remote_base_dir: /drop

  object_store:
    # localfs: fully offline, no external deps. Prod uses ADLS Gen2 via the
    # same Protocol — config-only switch (see environments/prod.yaml).
    # To use the Azurite emulator instead: set type=azurite and fill
    # endpoint/account_key (see .env.example for the well-known dev key).
    type: localfs
    endpoint: file:///tmp/datalink-localfs
    container: datalink-raw

  warehouse:
    type: duckdb
    path: ./warehouse.duckdb

  operational_dbs:
    # Current prod target. Phase 5.7: MCR pulls work after moving to native
    # Docker-in-WSL2, so SQL Server is live in the default compose stack.
    # `sqlserver_init` container bootstraps the DataLinkUM DB + [UM] schema +
    # `datalink` login with db_owner rights on first `make up`.
    sqlserver:
      type: sqlserver
      host: 127.0.0.1
      port: 1433
      user: datalink
      password: datalink_local_only
      database: DataLinkUM
    # Future prod target. Host port :5434 because some machines have a
    # Windows-native Postgres squatting on :5432 (see docker-compose.yml).
    postgres:
      type: postgres
      host: 127.0.0.1
      port: 5434
      user: datalink
      password: datalink_local_only
      database: datalink_um
    # Second Postgres on :5433 used only locally to demo the router
    # fanning out to multiple targets. Prod has [sqlserver, postgres]; this
    # entry goes away there.
    postgres_replica:
      type: postgres
      host: 127.0.0.1
      port: 5433
      user: datalink
      password: datalink_local_only
      database: datalink_um_replica

  notifier:
    type: file
    path: ./logs/notifications.jsonl

  llm:
    type: stub
    model: claude-haiku-4-5-20251001
    max_tokens: 4096

  secrets:
    type: env
