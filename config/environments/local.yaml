# Local environment: Windows 11 + WSL2 + Docker Desktop.
# Selected by DL_ENV=local (the default).

env: local
orchestrator: local_sequential

adapters:
  sftp:
    type: atmoz
    host: localhost
    port: 2222
    user: datalink
    password: datalink_local_only
    remote_base_dir: /drop

  object_store:
    # localfs: fully offline, no external deps. Prod uses ADLS Gen2 via the
    # same Protocol — config-only switch (see environments/prod.yaml).
    # To use the Azurite emulator instead: set type=azurite and fill
    # endpoint/account_key (see .env.example for the well-known dev key).
    type: localfs
    endpoint: file:///tmp/datalink-localfs
    container: datalink-raw

  warehouse:
    type: duckdb
    path: ./warehouse.duckdb

  operational_dbs:
    # Current prod target. Local host-port :1433 maps to the SQL Server
    # container when `make up-mcr` succeeds; Docker Desktop 4.51.0 blocks
    # the MCR pull on some setups, so this target is effectively disabled
    # in local default (not listed in features.warehouse_router.targets).
    sqlserver:
      type: sqlserver
      host: localhost
      port: 1433
      user: sa
      password: DataLink_LocalOnly_2026!
      database: datalink_um
    # Future prod target. Host port :5434 because some machines have a
    # Windows-native Postgres squatting on :5432 (see docker-compose.yml).
    postgres:
      type: postgres
      host: localhost
      port: 5434
      user: datalink
      password: datalink_local_only
      database: datalink_um
    # Second Postgres on :5433 used only locally to demo the router
    # fanning out to multiple targets. Prod has [sqlserver, postgres]; this
    # entry goes away there.
    postgres_replica:
      type: postgres
      host: localhost
      port: 5433
      user: datalink
      password: datalink_local_only
      database: datalink_um_replica

  notifier:
    type: file
    path: ./logs/notifications.jsonl

  llm:
    type: stub
    model: claude-haiku-4-5-20251001
    max_tokens: 4096

  secrets:
    type: env
