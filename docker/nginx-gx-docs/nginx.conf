# Minimal nginx — serves Great Expectations Data Docs over HTTP.
# GX writes the data_docs/ tree to gx/uncommitted/data_docs/local_site
# whenever a checkpoint runs; we bind-mount that into the container and
# serve it as static HTML. No auth — local dev only.

worker_processes 1;

events { worker_connections 32; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 30s;
    server_tokens off;

    server {
        listen 8090 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # `try_files` with $uri/ returns 403 (not fall-through) on an empty
        # directory when autoindex is off. Easier: intercept 403 AND 404 and
        # redirect both to the static fallback page.
        location / {
            try_files $uri $uri/ =404;
        }

        error_page 403 404 = /_fallback;
        location = /_fallback {
            internal;
            root /usr/share/nginx;
            try_files /fallback/index.html =500;
        }
    }
}
