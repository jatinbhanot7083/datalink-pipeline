# Grafana datasources — provisioned at container start so the user doesn't
# have to click through the UI to wire Prom / Loki / Tempo.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: datalink-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    uid: datalink-loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 2000
      derivedFields:
        # Click a trace_id in a log line → jumps to Tempo.
        - datasourceUid: datalink-tempo
          matcherRegex: "trace_id=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"

  - name: Tempo
    type: tempo
    uid: datalink-tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: datalink-loki
        filterByTraceID: true
      serviceMap:
        datasourceUid: datalink-prometheus
      nodeGraph:
        enabled: true
