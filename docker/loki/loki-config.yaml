# Loki config — single-binary, filesystem-backed. Tuned for local dev.
# NOT for prod. Prod would use S3/Azure Blob + a compactor.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2025-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Allow ingestion from OTEL collector at wide rate limits (it's local dev).
limits_config:
  reject_old_samples: false
  reject_old_samples_max_age: 168h
  max_global_streams_per_user: 10000
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  allow_structured_metadata: true
  retention_period: 168h  # 7 days

ruler:
  enable_api: true
